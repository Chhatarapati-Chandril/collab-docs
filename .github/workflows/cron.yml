name: Keep Backend and Database Alive

on:
    schedule:
        # Run every 10 minutes, offset from the common :00/:10/:20 slots.
        - cron: "7,17,27,37,47,57 * * * *"

    # Allow manual execution from GitHub Actions.
    workflow_dispatch:

# Central configuration for this workflow.
env:
    CURL_CONNECT_TIMEOUT: 10
    CURL_MAX_TIME: 45

jobs:
    ping:
        name: Ping production backend
        runs-on: ubuntu-latest
        timeout-minutes: 3
        env:
            HEALTH_URL: ${{ secrets.BACKEND_HEALTH_URL }}

        steps:
            # ------------------------------------------------------------
            # 1. Validate configuration
            # ------------------------------------------------------------
            - name: Validate health URL
              shell: bash
              run: |
                  set -euo pipefail

                  if [[ -z "${HEALTH_URL:-}" ]]; then
                    echo "::error::BACKEND_HEALTH_URL is missing or empty."
                    echo "::error::Configure it in:"
                    echo "::error::Repository → Settings → Secrets and variables → Actions"
                    exit 1
                  fi

                  echo "Health URL is configured."
                  echo "Expected endpoint:"
                  echo "https://collab-docs-fxgb.onrender.com/api/v1/health"

            # ------------------------------------------------------------
            # 2. Ping backend
            # ------------------------------------------------------------
            - name: Check backend health
              id: health
              shell: bash
              run: |
                  set -uo pipefail

                  echo "========================================"
                  echo "CollabDocs Production Health Check"
                  echo "========================================"
                  echo "UTC time: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
                  echo "Endpoint: ${HEALTH_URL}"
                  echo ""

                  RESPONSE_FILE="$(mktemp)"

                  CURL_EXIT=0

                  curl \
                    --fail-with-body \
                    --silent \
                    --show-error \
                    --location \
                    --connect-timeout "${CURL_CONNECT_TIMEOUT}" \
                    --max-time "${CURL_MAX_TIME}" \
                    --output "${RESPONSE_FILE}" \
                    --write-out \
                      $'\n--- Metrics ---\nhttp_status=%{http_code}\ntotal_time=%{time_total}s\nconnect_time=%{time_connect}s\nttfb=%{time_starttransfer}s\n' \
                    "${HEALTH_URL}" > curl-metrics.txt 2>&1 || CURL_EXIT=$?

                  echo "--- Response ---"
                  if [[ -s "${RESPONSE_FILE}" ]]; then
                    cat "${RESPONSE_FILE}"
                  else
                    echo "(no response body)"
                  fi

                  echo ""
                  cat curl-metrics.txt

                  echo ""
                  echo "--- Result ---"

                  if [[ "${CURL_EXIT}" -eq 0 ]]; then
                    echo "✅ Health check PASSED."
                    echo "Backend and database health endpoint are reachable."
                  else
                    echo "❌ Health check FAILED."
                    echo "curl exit code: ${CURL_EXIT}"
                    echo ""
                    echo "Possible causes:"
                    echo "  - Render service is cold or unavailable"
                    echo "  - Database connection failed"
                    echo "  - Health endpoint returned 4xx/5xx"
                    echo "  - Network/connection timeout"
                    echo ""
                    echo "Check the Render logs for the exact failure."
                    exit "${CURL_EXIT}"
                  fi

                  rm -f "${RESPONSE_FILE}" curl-metrics.txt

            # ------------------------------------------------------------
            # 3. Final status
            # ------------------------------------------------------------
            - name: Confirm successful keep-alive
              if: success()
              run: |
                  echo "✅ CollabDocs keep-alive completed successfully."
                  echo "The production health endpoint responded successfully."
