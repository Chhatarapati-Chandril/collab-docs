<div class="login-wrapper">
    <div class="theme-toggle-container">
        <mat-button-toggle-group
            [value]="themeService.themeSig()"
            (change)="themeService.setTheme($event.value)"
            hideSingleSelectionIndicator="true"
            class="theme-toggle"
        >
            <mat-button-toggle value="light"><mat-icon>light_mode</mat-icon></mat-button-toggle>
            <mat-button-toggle value="dark"><mat-icon>dark_mode</mat-icon></mat-button-toggle>
            <mat-button-toggle value="system"
                ><mat-icon>brightness_auto</mat-icon></mat-button-toggle
            >
        </mat-button-toggle-group>
    </div>
    <div class="login-left">
        <div class="logo">CollabDocs</div>
        <div class="hero-content">
            <h1 class="hero-headline">Write together, in real time.</h1>
            <p class="hero-tagline">Real-time collaborative documents, built for teams.</p>
        </div>
        <div class="login-card">
            <div id="googleButtonContainer"></div>
        </div>
    </div>
    <div class="login-right">
        <div class="animation-scene">
            <div class="spotlight"></div>

            <div class="glass-panel glass-panel-back"></div>

            <div class="glass-panel glass-panel-front">
                <div class="panel-header">
                    <div class="dot red"></div>
                    <div class="dot yellow"></div>
                    <div class="dot green"></div>
                </div>
                <div class="panel-body">
                    <div class="skeleton-line skeleton-title"></div>
                    <div class="skeleton-line w-100"></div>
                    <div class="skeleton-line w-85"></div>
                    <div class="skeleton-line w-90"></div>

                    <div class="cursor-wrapper cursor-1">
                        <div class="cursor-arrow" [style.color]="getColorForUser('alice')">
                            <svg
                                width="24"
                                height="24"
                                viewBox="0 0 24 24"
                                fill="currentColor"
                                xmlns="http://www.w3.org/2000/svg"
                            >
                                <path
                                    d="M4 2L20 12L12 14L10 22L4 2Z"
                                    stroke="white"
                                    stroke-width="2"
                                    stroke-linejoin="round"
                                />
                            </svg>
                        </div>
                        <div class="cursor-tag" [style.background-color]="getColorForUser('alice')">
                            Alice
                        </div>
                    </div>

                    <div class="cursor-wrapper cursor-2">
                        <div class="cursor-arrow" [style.color]="getColorForUser('bob')">
                            <svg
                                width="24"
                                height="24"
                                viewBox="0 0 24 24"
                                fill="currentColor"
                                xmlns="http://www.w3.org/2000/svg"
                            >
                                <path
                                    d="M4 2L20 12L12 14L10 22L4 2Z"
                                    stroke="white"
                                    stroke-width="2"
                                    stroke-linejoin="round"
                                />
                            </svg>
                        </div>
                        <div class="cursor-tag" [style.background-color]="getColorForUser('bob')">
                            Bob
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
