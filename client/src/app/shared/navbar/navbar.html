<mat-toolbar class="app-toolbar">
    <span class="brand" routerLink="/home">CollabDocs</span>

    <span class="spacer"></span>

    <div class="toolbar-actions">
        <!-- Compact Theme Selector -->
        <span
            [matMenuTriggerFor]="themeMenu"
            #themeMenuTrigger="matMenuTrigger"
            class="theme-menu-anchor"
        ></span>
        <button
            mat-icon-button
            class="theme-toggle-btn"
            [matTooltip]="themeTooltip()"
            (click)="onThemeButtonClick()"
            (contextmenu)="onThemeContextMenu($event)"
            (keydown)="onThemeKeydown($event)"
            (touchstart)="onTouchStart()"
            (touchend)="onTouchEnd()"
            (touchcancel)="onTouchEnd()"
            [attr.aria-label]="themeAriaLabel()"
        >
            <mat-icon>{{ themeIcon() }}</mat-icon>
        </button>

        <mat-menu #themeMenu="matMenu" class="theme-dropdown-menu" xPosition="before">
            <button
                mat-menu-item
                (click)="selectTheme('light')"
                [class.selected]="themeService.themeSig() === 'light'"
                role="menuitemradio"
                [attr.aria-checked]="themeService.themeSig() === 'light'"
            >
                <mat-icon class="menu-item-icon">light_mode</mat-icon>
                <span class="menu-item-text">Light</span>
                @if (themeService.themeSig() === 'light') {
                    <mat-icon class="check-icon">check</mat-icon>
                }
            </button>

            <button
                mat-menu-item
                (click)="selectTheme('dark')"
                [class.selected]="themeService.themeSig() === 'dark'"
                role="menuitemradio"
                [attr.aria-checked]="themeService.themeSig() === 'dark'"
            >
                <mat-icon class="menu-item-icon">dark_mode</mat-icon>
                <span class="menu-item-text">Dark</span>
                @if (themeService.themeSig() === 'dark') {
                    <mat-icon class="check-icon">check</mat-icon>
                }
            </button>

            <button
                mat-menu-item
                (click)="selectTheme('system')"
                [class.selected]="themeService.themeSig() === 'system'"
                role="menuitemradio"
                [attr.aria-checked]="themeService.themeSig() === 'system'"
            >
                <mat-icon class="menu-item-icon">desktop_windows</mat-icon>
                <span class="menu-item-text">System / Automatic</span>
                @if (themeService.themeSig() === 'system') {
                    <mat-icon class="check-icon">check</mat-icon>
                }
            </button>
        </mat-menu>

        <button
            mat-icon-button
            routerLink="/notifications"
            matBadge="{{ unreadCount() }}"
            [matBadgeHidden]="unreadCount() === 0"
            matBadgeColor="warn"
        >
            <mat-icon>notifications</mat-icon>
        </button>

        <button mat-icon-button [matMenuTriggerFor]="userMenu">
            <mat-icon>account_circle</mat-icon>
        </button>
    </div>

    <mat-menu #userMenu="matMenu" class="user-profile-menu" xPosition="before">
        <div
            class="menu-user-header"
            (click)="$event.stopPropagation()"
            (keydown.enter)="$event.stopPropagation()"
            tabindex="0"
            role="button"
        >
            <div
                class="user-avatar-large"
                [style.background-color]="getColorForUser(user()?.id || '')"
            >
                {{ getInitial(userDisplayName()) }}
            </div>
            <div class="user-info">
                <div class="user-name">{{ userDisplayName() }}</div>
                <div class="user-email">{{ user()?.email }}</div>
            </div>
        </div>
        <mat-divider></mat-divider>
        <button mat-menu-item routerLink="/profile">
            <mat-icon>person</mat-icon>
            <span>Manage profile</span>
        </button>
        <button mat-menu-item (click)="onLogout()">
            <mat-icon color="warn">logout</mat-icon>
            <span style="color: var(--mat-sys-error)">Sign out</span>
        </button>
    </mat-menu>
</mat-toolbar>
