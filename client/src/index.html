<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Collab Docs</title>
        <base href="/" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta
            name="description"
            content="Collab Docs is a real-time collaborative document editor for creating, editing, and sharing documents."
        />
        <meta name="theme-color" content="#ffffff" />

        <!-- Open Graph / Facebook -->
        <meta property="og:type" content="website" />
        <meta property="og:url" content="https://collab-docss.vercel.app/" />
        <meta property="og:title" content="CollabDocs – Real-Time Collaborative Document Editor" />
        <meta
            property="og:description"
            content="Create, edit, and collaborate on documents in real time with CollabDocs."
        />
        <meta property="og:site_name" content="CollabDocs" />

        <!-- Twitter -->
        <meta name="twitter:card" content="summary" />
        <meta name="twitter:site" content="CollabDocs" />
        <meta name="twitter:title" content="CollabDocs – Real-Time Collaborative Document Editor" />
        <meta
            name="twitter:description"
            content="Create, edit, and collaborate on documents in real time with CollabDocs."
        />

        <!-- Favicon -->
        <link rel="icon" type="image/x-icon" href="favicon.svg" />
        <link rel="apple-touch-icon" href="favicon.svg" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap"
            rel="stylesheet"
        />
        <link
            href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&display=swap"
            rel="stylesheet"
        />
        <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
        <script src="https://accounts.google.com/gsi/client" async defer></script>
        <script>
            (function () {
                try {
                    var theme = localStorage.getItem('collab_docs_theme');
                    if (theme === 'dark' || theme === 'light') {
                        document.documentElement.setAttribute('data-theme', theme);
                    }
                } catch (e) {}
            })();
        </script>
    </head>
    <body>
        <app-root></app-root>
    </body>
</html>
